<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 工具库</title>
    <style>
        :root {
            --primary: #0070f3;
            --bg: #f5f5f5;
            --card: #fff;
            --text: #333;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #111;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .tool-card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid transparent;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .tool-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            color: var(--primary);
        }

        .tool-card p {
            margin: 0;
            color: #666;
            font-size: 0.95rem;
        }

        .tool-meta {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #999;
            display: flex;
            gap: 10px;
        }

        .badge {
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>MCP 工具库</h1>
            <p class="subtitle">Model Context Protocol (MCP)定义与API文档索引</p>
        </header>

        <div class="grid">
            <!-- Tool: Normalize Time -->
            <a href="normalize-time-def.html" class="tool-card">
                <h2>🕒 时间标准化 (Normalize Time)</h2>
                <p>将自然语言描述的时间点、时间段、序列转换为带有节假日支持的标准绝对时间格式。</p>
                <div class="tool-meta">
                    <span class="badge">工具</span>
                    <span class="badge">v1.0</span>
                </div>
            </a>

            <!-- Tool: Watchlist Manager -->
            <a href="watchlist-manager-def.html" class="tool-card">
                <h2>📈 自选股管理 (Watchlist Manager)</h2>
                <p>管理客户的自选股分组，查询分组详情及成分股信息，支持多市场筛选。</p>
                <div class="tool-meta">
                    <span class="badge">工具</span>
                    <span class="badge">v1.0</span>
                </div>
            </a>
        </div>
    </div>
</body>

</html>
